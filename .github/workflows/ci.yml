name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest -q
      - run: python build.py
      - uses: actions/upload-artifact@v5
        with:
          name: addon-zip
          path: dist/*.zip

  # Pushing a tag like v1.2.0 publishes a GitHub release with the installable zip.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the add-on version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('png_cutout_solid/blender_manifest.toml', 'rb'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match blender_manifest.toml version $version"
            exit 1
          fi
      - run: python build.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
